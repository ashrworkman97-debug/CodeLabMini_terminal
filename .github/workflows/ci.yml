name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Compile Code Lab Mini firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Arduino AVR platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile Code Lab Mini sketch
        run: |
          mkdir -p "$RUNNER_TEMP/clm_firmware"
          cp clm_firmware.ino "$RUNNER_TEMP/clm_firmware/clm_firmware.ino"
          arduino-cli compile --fqbn arduino:avr:uno --warnings all "$RUNNER_TEMP/clm_firmware"

  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile clm clm_ai.py clm_flash.py clm_paths.py clm_doctor.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check firmware uploader syntax
        run: python -m py_compile clm_flash.py

      - name: Check installer syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh && bash -n install_macos.sh

      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw install_windows.ps1))

      - name: Check CLI startup
        run: |
          python clm --version
          python clm --help
          python clm doctor
          python clm doctor --json
